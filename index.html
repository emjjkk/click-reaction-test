<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reaction Time Test</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-size: 2rem;
      user-select: none;
      cursor: pointer;
      background: white;
      color: black;
    }
  </style>
</head>
<body>
  Click to start
</body>

<script>
  const body = document.body

  let state = "idle" // idle | waiting | ready | result
  let startTime = 0
  let timeoutId = null

  function reset() {
    state = "idle"
    body.style.background = "white"
    body.style.color = "black"
    body.textContent = "Click to start"
    if (timeoutId) {
      clearTimeout(timeoutId)
      timeoutId = null
    }
  }

  body.addEventListener("click", () => {
    if (state === "idle") {
      state = "waiting"
      body.style.background = "#1e3a8a" // blue
      body.style.color = "white"
      body.textContent = "Wait..."

      const delay = 1000 + Math.random() * 3000

      timeoutId = setTimeout(() => {
        state = "ready"
        body.style.background = "#16a34a" // green
        body.textContent = "CLICK!"
        startTime = performance.now()
      }, delay)

    } else if (state === "waiting") {
      state = "result"
      body.style.background = "#7f1d1d" // red
      body.textContent = "Too early! Click to try again."
      clearTimeout(timeoutId)

    } else if (state === "ready") {
      const reaction = Math.round(performance.now() - startTime)
      state = "result"
      body.style.background = "white"
      body.style.color = "black"
      body.textContent = `${reaction} ms — click to go again`

    } else if (state === "result") {
      reset()
    }
  })
</script>
</html>
